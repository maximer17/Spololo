<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spololo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" id="themeColor" content="#0F1013">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Spololo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@600;700&family=Rubik:wght@500;700;800&family=Poppins:wght@500;600;700&family=Bungee&family=Press+Start+2P&family=Baloo+2:wght@500;700;800&family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&family=Lilita+One&family=Quicksand:wght@500;700&family=Comfortaa:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout : coque d'appli plein écran — header et nav fixes, seul le contenu défile */
:root{
  --bg:#F4F4F1; --surface:#FFFFFF; --surface2:#ECECE7; --ink:#121316; --muted:#55575E; --line:#E2E2DC;
  --a:#E8175D; --b:#0088C7; --c:#5A9400; --xp:#E0A400; --ok:#5A9400;
  --on-a:#fff; --on-b:#fff; --on-c:#fff; --on-xp:#121316;
  --shadow:rgba(18,19,22,.14); --r:16px; --rs:12px;
  --font-display:"Chakra Petch", system-ui, sans-serif;
  --font-body:"Barlow", system-ui, -apple-system, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1013; --surface:#18191E; --surface2:#22242B; --ink:#F2F3F5; --muted:#9A9EA8; --line:#2A2C34;
    --a:#FF3D7F; --b:#2EC5FF; --c:#B6F23A; --xp:#FFD23F; --ok:#B6F23A; --on-c:#121316; --on-b:#121316;
    --shadow:rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1013; --surface:#18191E; --surface2:#22242B; --ink:#F2F3F5; --muted:#9A9EA8; --line:#2A2C34;
  --a:#FF3D7F; --b:#2EC5FF; --c:#B6F23A; --xp:#FFD23F; --ok:#B6F23A; --on-c:#121316; --on-b:#121316;
  --shadow:rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;background:var(--bg)}
html,body{margin:0;overflow:hidden}
body{position:fixed;inset:0;height:auto}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.4;font-weight:500;-webkit-tap-highlight-color:transparent;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;font-weight:700;letter-spacing:.01em}
.tn{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--xp);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

header{flex:none;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;min-width:0}
[hidden]{display:none !important}
.logo{width:34px;height:34px;border-radius:9px;flex:none;display:block}
.logo.av{display:grid;place-items:center;background:var(--surface2);font-size:20px}
.brand h1{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;letter-spacing:.05em}
.hspace{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 10px;font-weight:700;font-size:13px;background:var(--surface2);border:0;white-space:nowrap;cursor:pointer}
.iconbtn{width:38px;height:38px;border-radius:var(--rs);border:0;background:var(--surface2);display:grid;place-items:center;cursor:pointer;flex:none}
.sync{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none;opacity:.7}
.sync.cloud{background:var(--ok);opacity:1} .sync.err{background:var(--a);opacity:1}

#scroller{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
main{padding:18px 16px max(120px, 30vh);max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.label{font-family:var(--font-display);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.note{font-size:14px;color:var(--muted);font-weight:600}
.empty{text-align:center;color:var(--muted);font-weight:600;padding:8px}

.btn{--sc:var(--b);--sc-on:var(--on-b);border:0;border-radius:var(--rs);padding:14px 16px;font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;background:var(--sc);color:var(--sc-on);box-shadow:0 3px 0 color-mix(in srgb,var(--sc) 50%,#000);transition:transform .06s, box-shadow .06s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--sc) 50%,#000)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:none}
.btn.small{padding:8px 12px;font-size:13px}
.btn.block{width:100%}
.btn.danger{--sc:var(--a);--sc-on:var(--on-a)}
.link{background:none;border:0;color:var(--muted);font-weight:700;font-size:14px;cursor:pointer;padding:8px;text-decoration:underline;text-underline-offset:3px}
.foot{display:flex;justify-content:center;gap:4px}

/* accueil */
.warn{display:flex;gap:10px;align-items:flex-start;text-align:left;border:0;border-radius:var(--r);padding:12px 14px;background:color-mix(in srgb,var(--a) 18%,var(--surface));color:var(--ink);font-size:14px;font-weight:600;cursor:pointer}
.warn b{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.03em}
.today h2{font-size:22px;text-transform:uppercase}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{--sc:var(--a);--sc-on:var(--on-a);position:relative;border:0;background:var(--surface);border-radius:var(--r);padding:12px 10px 12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:128px;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sc)}
.tile .L{font-family:var(--font-display);font-weight:700;font-size:38px;line-height:1;color:var(--sc)}
.tile b{font-size:14px;line-height:1.2;font-weight:700}
.tile small{font-size:12px;color:var(--muted);font-weight:600;margin-top:auto}
.tile.rec{background:var(--sc);color:var(--sc-on)}
.tile.rec .L{color:var(--sc-on)} .tile.rec small{color:var(--sc-on);opacity:.85}
.tile.rec::before{display:none}
.tile .flag{align-self:flex-start;font-family:var(--font-display);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:rgba(0,0,0,.18)}
.tile:not(.rec) .flag{background:var(--surface2);color:var(--ink)}
.tile:active{transform:translateY(1px)}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.w{background:var(--surface);border:0;border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0;text-align:left;color:inherit}
button.w{cursor:pointer}
.w.full{grid-column:1 / -1}
.w .big{font-family:var(--font-display);font-size:28px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.w .big small{font-size:15px;color:var(--muted);font-weight:600}
.delta{font-size:13px;font-weight:700}
.delta.up{color:var(--ok)} .delta.down{color:var(--a)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:6px 0 4px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px}
.day span{font-size:12px;font-weight:700;color:var(--muted)}
.day i{width:100%;max-width:40px;aspect-ratio:1;border-radius:10px;background:var(--surface2);display:grid;place-items:center;font-style:normal;font-family:var(--font-display);font-weight:700;font-size:16px}
.day i.on{background:var(--sc);color:var(--sc-on)}
.day.today span{color:var(--ink)}
.day.today i:not(.on){box-shadow:inset 0 0 0 2px var(--ink)}
.xpbar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--xp)}
.spark svg{width:100%;height:56px;display:block}
.gmini{display:flex;flex-direction:column;gap:4px}
.gmini .bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.gmini .bar i{display:block;height:100%;background:var(--b)}

/* calendrier */
.calhead{display:flex;align-items:center;gap:8px}
.calhead h2{font-size:20px;text-transform:uppercase;flex:1;text-align:center}
.calnav{width:40px;height:40px;border-radius:var(--rs);border:0;background:var(--surface);font-size:20px;font-weight:700;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr) 30px;gap:4px;align-items:center}
.cal .h{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding-bottom:4px}
.cd{aspect-ratio:1;border:0;border-radius:10px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.cd.out{opacity:.35}
.cd.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cd.sel{background:var(--ink);color:var(--bg)}
.cd .dots{display:flex;gap:2px}
.cd .dots b{width:16px;height:16px;border-radius:5px;background:var(--sc);color:var(--sc-on);font-size:10px;display:grid;place-items:center;font-family:var(--font-display)}
.wk{text-align:center;font-size:15px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-weight:600}

/* néon : halos dans les deux thèmes, plus doux en clair */
:root{--g:38%;--g2:16%;--amb:18%}
:root[data-theme="dark"]{--g:58%;--g2:24%;--amb:30%}
.tile{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--sc) 35%,transparent)}
.tile .L{text-shadow:0 0 14px color-mix(in srgb,var(--sc) var(--g),transparent)}
.tile.rec{box-shadow:0 0 0 1px var(--sc),0 0 24px color-mix(in srgb,var(--sc) var(--g),transparent),0 0 60px color-mix(in srgb,var(--sc) var(--g2),transparent)}
.tile.rec .L{text-shadow:0 0 10px rgba(255,255,255,.55)}
.day i.on,.sesshead .L,.cd .dots b,.item .L{box-shadow:0 0 14px color-mix(in srgb,var(--sc) var(--g),transparent)}
.pill.on{box-shadow:0 0 14px color-mix(in srgb,var(--ok) var(--g),transparent)}
.maxbtn.on{box-shadow:0 0 12px color-mix(in srgb,var(--a) var(--g),transparent)}
.xpbar i,.gmini .bar i,.gbar i{box-shadow:0 0 10px color-mix(in srgb,currentColor var(--g),transparent)}
.gmini .bar i,.gbar i{color:var(--b)} .xpbar i{color:var(--xp)}
nav button.on svg{filter:drop-shadow(0 0 6px color-mix(in srgb,var(--a) var(--g),transparent))}
.btn:not(.ghost){box-shadow:0 3px 0 color-mix(in srgb,var(--sc) 50%,#000),0 0 22px color-mix(in srgb,var(--sc) var(--g2),transparent)}
/* fond d'ambiance de l'accueil : trois halos flous, fixes pendant le défilement */
#scroller.homebg{background:
  radial-gradient(70% 38% at -5% -5%, color-mix(in srgb,var(--a) var(--amb),transparent), transparent 72%),
  radial-gradient(60% 42% at 108% 28%, color-mix(in srgb,var(--b) var(--amb),transparent), transparent 72%),
  radial-gradient(70% 34% at 25% 108%, color-mix(in srgb,var(--c) calc(var(--amb) * .7),transparent), transparent 72%),
  var(--bg)}
.homebg .w,.homebg .tile:not(.rec){background:color-mix(in srgb,var(--surface) 76%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.homebg .w{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 6%,transparent)}
/* séance */
.sesshead{display:flex;align-items:center;gap:12px}
.sesshead .L{width:46px;height:46px;border-radius:var(--rs);background:var(--sc);color:var(--sc-on);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:26px;flex:none}
.sesshead h2{font-size:19px;text-transform:uppercase}
.ex{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:inset 4px 0 0 transparent}
.ex.full{box-shadow:inset 4px 0 0 var(--ok)}
.ex.off{opacity:.5}
.exhead{display:flex;align-items:center;gap:8px}
.star{width:32px;height:32px;border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--xp);padding:0;flex:none}
.namesel{position:relative;flex:1;min-width:0;display:flex;align-items:center}
.namesel select{appearance:none;-webkit-appearance:none;border:0;background:none;padding:0 22px 0 0;width:100%;font-family:var(--font-display);font-weight:700;font-size:18px;line-height:1.25;color:var(--ink);cursor:pointer;text-overflow:ellipsis;white-space:nowrap;overflow:hidden}
.namesel::after{content:"";position:absolute;right:4px;top:50%;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.qbtn{width:28px;height:28px;border-radius:50%;border:0;background:var(--surface2);color:var(--muted);font-weight:800;font-size:14px;cursor:pointer;flex:none}
.meta{font-size:14px;color:var(--muted);font-weight:600;margin-top:-6px}
.up2{color:var(--xp);font-weight:700}
.load{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fld{display:flex;align-items:baseline;justify-content:center;gap:5px;background:var(--surface2);border-radius:var(--rs);padding:0 12px;border:2px solid transparent}
.fld:focus-within{border-color:var(--b)}
.fld input{width:100%;min-width:0;border:0;background:none;padding:10px 0;font-family:var(--font-display);font-weight:700;font-size:22px;text-align:right;outline:none;font-variant-numeric:tabular-nums}
.fld input::placeholder{color:var(--muted);opacity:.5}
.fld span{font-size:14px;color:var(--muted);font-weight:700;flex:none}
.fld{align-items:center}
.maxbtn{border:0;border-radius:8px;padding:5px 7px;margin-left:2px;font-family:var(--font-display);font-weight:700;font-size:11px;letter-spacing:.05em;background:var(--surface);color:var(--muted);cursor:pointer;flex:none}
.maxbtn.on{background:var(--a);color:var(--on-a)}
.fld.isMax input::placeholder{color:var(--a);opacity:1}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{min-width:56px;height:46px;border-radius:var(--rs);border:2px solid var(--line);background:none;font-family:var(--font-display);font-weight:700;font-size:17px;cursor:pointer;color:var(--muted);padding:0 10px}
.pill.on{background:var(--ok);border-color:var(--ok);color:var(--on-c)}
.pill.add{border-style:dashed;min-width:46px;font-size:20px}
.offmsg{font-size:14px;color:var(--muted);font-weight:600}
.keep{align-self:flex-start;border:0;background:var(--surface2);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer}

/* chrono */
#rest{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 76px);z-index:30;max-width:616px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:8px 10px 8px 14px;display:none;align-items:center;gap:10px;box-shadow:0 8px 24px var(--shadow)}
#rest.on{display:flex}
#rest .t{font-family:var(--font-display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;min-width:70px}
#rest .bar{flex:1;height:6px;border-radius:3px;background:color-mix(in srgb,var(--bg) 25%,transparent);overflow:hidden}
#rest .bar i{display:block;height:100%;background:var(--xp)}
#rest button{border:0;border-radius:8px;padding:8px 10px;font-weight:700;background:color-mix(in srgb,var(--bg) 16%,transparent);color:var(--bg);cursor:pointer}
#rest.ready{background:var(--ok);color:var(--on-c)}

nav{flex:none;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);display:flex;justify-content:space-around;z-index:25}
nav button{position:relative;flex:1;max-width:110px;background:none;border:0;border-radius:var(--rs);padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--muted);font-weight:700;font-size:11px}
nav button.on{color:var(--ink)}
nav button.on svg{color:var(--a)}
nav .live{position:absolute;top:4px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--a);display:none}
nav .live.on{display:block}

/* listes, progrès */
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--rs);background:var(--surface2)}
.item .L{width:32px;height:32px;border-radius:8px;background:var(--sc);color:var(--sc-on);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;flex:none}
.del{border:0;background:none;cursor:pointer;color:var(--muted);padding:6px;display:grid;place-items:center}
select.field,.field{width:100%;padding:11px;border-radius:var(--rs);border:0;background:var(--surface2);font-weight:700}
.chart svg{width:100%;height:auto;display:block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:var(--r);padding:10px;text-align:center}
.stat b{display:block;font-family:var(--font-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.stat small{font-weight:600;color:var(--muted);font-size:12px}

/* objectifs & succès */
.goal{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:var(--rs);background:var(--surface2)}
.goal.done{box-shadow:inset 3px 0 0 var(--ok)}
.gbar{height:8px;border-radius:4px;background:var(--surface);overflow:hidden}
.gbar i{display:block;height:100%;background:var(--b)}
.goal.done .gbar i{background:var(--ok)}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.ach{border-radius:var(--rs);padding:10px;background:var(--surface2);display:flex;flex-direction:column;gap:2px;text-align:center;align-items:center}
.ach .ic{font-size:28px;line-height:1.2}
.ach b{font-size:14px;line-height:1.2}
.ach small{font-size:12px;color:var(--muted);font-weight:600}
.ach.locked .ic{filter:grayscale(1);opacity:.3}
.ach.locked b{color:var(--muted)}
.ach.on{box-shadow:inset 0 0 0 2px var(--xp)}
.reward{font-size:11px;font-weight:700;color:var(--xp)}
.mini{border:0;background:var(--surface);border-radius:8px;padding:7px 10px;font-weight:700;font-size:13px;cursor:pointer}

/* programme */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{--sc:var(--a);--sc-on:var(--on-a);border:0;background:var(--surface);border-radius:var(--rs);padding:11px 4px;font-family:var(--font-display);font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:.04em}
.seg button.on{background:var(--sc);color:var(--sc-on)}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 4px;border-radius:var(--rs);background:var(--surface);transition:transform .15s ease;position:relative}
.prow.dragging{transition:none;z-index:5;box-shadow:0 10px 24px var(--shadow)}
.handle{width:34px;align-self:stretch;display:grid;place-items:center;color:var(--muted);cursor:grab;touch-action:none;flex:none}
.pbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.pctl{display:flex;align-items:center;gap:6px}
.prow .pn{width:100%;min-width:0;border:0;background:none;font-weight:700;font-size:16px;padding:6px 0}
.prow .pn:focus{outline:none;border-bottom:2px solid var(--b)}
.prow .ps{width:34px;text-align:center;border:0;background:var(--surface2);border-radius:8px;padding:7px 2px;font-weight:700}
.prow .pr{width:60px;text-align:center;border:0;background:var(--surface2);border-radius:8px;padding:7px 2px;font-weight:700}
.pstar{width:32px;height:32px;border:0;background:none;font-size:20px;color:var(--muted);cursor:pointer;flex:none;padding:0}
.pstar.on{color:var(--xp);text-shadow:0 0 10px color-mix(in srgb,var(--xp) var(--g),transparent)}
.prow .x{color:var(--muted);font-weight:700;font-size:13px}

/* barre de menu en haut (option, pour le mode écran d'accueil) */
body.navtop header{order:0} body.navtop nav{order:1;border-top:0;border-bottom:1px solid var(--line);padding-top:4px;padding-bottom:4px} body.navtop #scroller{order:2}
body.navtop #rest{bottom:auto;top:calc(env(safe-area-inset-top) + 128px)}
body.navtop #sheet{bottom:auto;top:calc(env(safe-area-inset-top) + 10px);left:8px;right:8px;border-radius:18px;max-height:80%}
/* feuilles & toasts */
#veil{position:fixed;inset:0;background:rgba(5,6,10,.55);z-index:40;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:640px;margin:0 auto;background:var(--bg);border-radius:18px 18px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:86%;overflow:auto;display:none;flex-direction:column;gap:10px}
#sheet h2{font-size:20px}
.open #veil{display:block} .open #sheet{display:flex}
#sheet input:not([type=checkbox]){width:100%;padding:12px;border-radius:var(--rs);border:0;background:var(--surface);font-weight:700}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:var(--surface);border-radius:var(--rs);padding:13px;font-weight:700;cursor:pointer}
.opt small{display:block;font-weight:600;color:var(--muted)}
.tipbox{background:var(--surface);border-radius:var(--rs);padding:12px;font-size:16px}
#toasts{position:fixed;top:calc(env(safe-area-inset-top) + 66px);left:12px;right:12px;z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{max-width:440px;width:100%;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:12px 14px;font-weight:700;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px var(--shadow);animation:pop .35s ease-out}
.toast .ic{font-size:26px}
.toast b{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.03em}
.toast small{display:block;font-weight:600;opacity:.8}
.toast.gold{background:var(--xp);color:var(--on-xp)}
@keyframes pop{from{transform:translateY(-10px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.toast{animation:none}.btn,.prow{transition:none}}

/* perso */
.pixel h1,.pixel h2,.pixel h3,.pixel .big,.pixel .L,.pixel .namesel select{font-size:12px !important;line-height:1.6}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.pal button{border:0;background:var(--surface);border-radius:var(--rs);padding:9px;cursor:pointer;text-align:left;font-weight:700;font-size:13px;display:flex;flex-direction:column;gap:6px}
.pal button.on,.fontlist button.on,.avs button.on{box-shadow:inset 0 0 0 2px var(--ink)}
.pal button[disabled],.avs button[disabled]{opacity:.45;cursor:not-allowed}
.sw{display:flex;gap:3px}.sw i{flex:1;height:18px;border-radius:4px}
.fontlist{display:flex;flex-direction:column;gap:6px}
.fontlist button{border:0;background:var(--surface);border-radius:var(--rs);padding:11px 12px;cursor:pointer;text-align:left;font-size:18px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.fontlist small{font-family:var(--font-body);font-size:12px;color:var(--muted);font-weight:700}
.avs{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:8px}
.avs button{aspect-ratio:1;border:0;background:var(--surface);border-radius:var(--rs);font-size:28px;cursor:pointer}
.avs button[disabled]{filter:grayscale(1)}
</style>

function lastFor(name){ const n = norm(name);

function viewCalendar(){

  const weeks = weeksMap(), tk = dkey(new Date()), nowWs = weekStart(new Date()).getTime();

function chartSVG(pts){
  const W = 340, H = 190, L = 40, Rr = 16, T = 18, B = 28;
  const vals = pts.map(p => p.v); let lo = Math.min(...vals), hi = Math.max(...vals);
  if (lo === hi){ lo = Math.max(0, lo - 5); hi = hi + 5; } else { const pad = (hi-lo)*0.15; lo = Math.max(0, lo-pad); hi = hi+pad; }
  const step = (hi-lo)/3, ticks = [0,1,2,3].map(i => lo + step*i);
  const x = i => L + (pts.length === 1 ? (W-L-Rr)/2 : i*(W-L-Rr)/(pts.length-1)), y = v => T + (H-T-B)*(1-(v-lo)/(hi-lo));
  const line = pts.map((p,i) => (i?"L":"M")+x(i).toFixed(1)+","+y(p.v).toFixed(1)).join(" ");
  const area = line + ` L${x(pts.length-1).toFixed(1)},${H-B} L${x(0).toFixed(1)},${H-B} Z`;
  const lp = pts[pts.length-1], li = pts.length-1, dl = d => new Date(d).toLocaleDateString("fr-FR",{day:"numeric",month:"short"});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Charge max par séance">
    ${ticks.map(t => `<line x1="${L}" x2="${W-Rr}" y1="${y(t)}" y2="${y(t)}" style="stroke:var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" font-size="11" font-weight="600" style="fill:var(--muted)">${fmt(Math.round(t*2)/2)}</text>`).join("")}
    <path d="${area}" style="fill:var(--b);opacity:.14"/>
    <path d="${line}" fill="none" style="stroke:var(--b)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i) => `<circle cx="${x(i)}" cy="${y(p.v)}" r="${i===li?6:3.5}" style="fill:${i===li?"var(--xp)":"var(--b)"};stroke:var(--surface)" stroke-width="2"/>`).join("")}
    <text x="${Math.min(x(li), W-Rr-4)}" y="${y(lp.v)-12}" text-anchor="end" font-size="13" font-weight="700" style="fill:var(--ink)">${fmt(lp.v)} kg</text>
    <text x="${x(0)}" y="${H-8}" text-anchor="${pts.length===1?"middle":"start"}" font-size="11" font-weight="600" style="fill:var(--muted)">${dl(pts[0].d)}</text>
    ${pts.length>1 ? `<text x="${x(li)}" y="${H-8}" text-anchor="end" font-size="11" font-weight="600" style="fill:var(--muted)">${dl(lp.d)}</text>` : ""}
  </svg>`;
}

let drag = null;
document.addEventListener("pointerdown", e => {
  const hd = e.target.closest(".handle"); if (!hd) return;
  e.preventDefault(); const row = hd.closest(".prow"), rows = [...document.querySelectorAll(".prow")], from = rows.indexOf(row);
  const rects = rows.map(r => r.getBoundingClientRect()), step = rows.length > 1 ? rects[1].top - rects[0].top : rects[0].height + 8;
  drag = {row, rows, from, to:from, rects, step, y0:e.clientY}; row.classList.add("dragging");
  try{ hd.setPointerCapture(e.pointerId); }catch(_){}
});
document.addEventListener("pointermove", e => {
  if (!drag) return; e.preventDefault();
  const dy = e.clientY - drag.y0; drag.row.style.transform = `translateY(${dy}px)`;
  const c = drag.rects[drag.from].top + drag.rects[drag.from].height/2 + dy; let to = drag.from;
  drag.rects.forEach((r, i) => { const mid = r.top + r.height/2; if (i < drag.from && c < mid) to = Math.min(to, i); if (i > drag.from && c > mid) to = Math.max(to, i); });
  drag.to = to;
  drag.rows.forEach((r, i) => { if (i === drag.from) return; let s = 0; if (drag.from < to && i > drag.from && i <= to) s = -drag.step; if (drag.from > to && i < drag.from && i >= to) s = drag.step; r.style.transform = s ? `translateY(${s}px)` : ""; });
}, {passive:false});
function endDrag(){ if (!drag) return; const {from, to} = drag; drag = null;
  if (from !== to){ const a = S.program[progTab].exercises; const [x] = a.splice(from, 1); a.splice(to, 0, x); saveState(); }
  render(); }
document.addEventListener("pointerup", endDrag); document.addEventListener("pointercancel", endDrag);

  calDay: b => { calSel = b.dataset.d; render(); },
  pill: b => { const e = S.current.entries[+b.dataset.i], k = +b.dataset.k, before = e.done; e.done = e.done === k ? k-1 : k; touch(); render(); if (e.done > before) startRest(e.rest || R); },
  maxReps: b => { const e = S.current.entries[+b.dataset.i]; e.rp = e.rp === "max" ? repsRange(e.target)[0] : "max"; touch(); render(); },
  pillAdd: b => { const e = S.current.entries[+b.dataset.i]; e.planned = Math.min(10, e.planned + 1); touch(); render(); },
  star: b => { const e = S.current.entries[+b.dataset.i]; e.on = !e.on; touch(); render(); },
  tip: b => { const e = S.current.entries[+b.dataset.i]; openSheet(`<h2>${esc(e.name)}</h2><div class="tipbox">💡 ${esc(e.tip)}</div><button class="btn ghost block" data-act="closeSheet">OK</button>`); },
  keepSwap: b => { const e = S.current.entries[+b.dataset.i];
    for (const k in S.program){ const ex = S.program[k].exercises.find(x => x.id === e.pid); if (ex){ const old = ex.name; ex.name = e.name; ex.alts = [old, ...(ex.alts||[]).filter(n => norm(n) !== norm(e.name) && norm(n) !== norm(old))]; ex.tip = ""; } }
    e.kept = true; saveState(); touch(); render(); toast("📋", "Programme mis à jour", e.name+" remplace l'ancien exo."); },
  addEx: () => openPicker("Ajouter un exo", n => { const ex = Object.values(S.program).flatMap(q => q.exercises).find(x => norm(x.name) === norm(n));
    S.current.entries.push(makeEntry({name:n, sets:ex ? ex.sets : 3, reps:ex ? ex.reps : "10-12", tip:ex ? ex.tip : "", alts:ex ? ex.alts : [], bonus:isAbs(n)})); touch(); render(); }),
  pickEx: b => { const n = b.dataset.n; remember(n); const cb = pickCb; pickCb = null; closeSheet(); cb && cb(n); },
  addExGo: () => { const n = $("#newEx").value.trim(); if (!n) return; S.current.entries.push(makeEntry({name:n, sets:Math.max(1, parseInt($("#newSets").value)||3), reps:$("#newReps").value.trim()||"10"})); touch(); closeSheet(); render(); },
  addAbs: b => { const x = ABS_POOL[+b.dataset.k]; S.current.entries.push(makeEntry({name:x.name, sets:3, reps:x.reps, bonus:true})); touch(); closeSheet(); render(); },
  otherGo: b => { const v = $("#otherIn").value.trim(); if (v){ doSwap(+b.dataset.i, v); } closeSheet(); },
  finish: () => finishSession(false),
  finishForce: () => finishSession(true),
  abandon: () => openConfirm("Abandonner la séance ?", "Rien ne sera enregistré.", "Oui, abandonner", () => { S.current = null; stopRest(); saveCurrent(true); tab = "home"; render(); }),
  resumeGo: () => { closeSheet(); tab = "session"; render(); },
  resumeSave: () => { const c = S.current; finishSession(true, new Date(new Date(c.updatedAt || Date.now()).getTime()).toISOString()); },
  resumeDrop: () => { S.current = null; saveCurrent(true); closeSheet(); tab = "home"; render(); },
  confirmYes: () => { closeSheet(); const cb = confirmCb; confirmCb = null; cb && cb(); },
  closeSheet: () => closeSheet(),
  backup: () => doBackup(),
  restore: () => openSheet(`<h2>Restaurer une sauvegarde</h2><div class="note">Choisis le fichier de sauvegarde (dans Fichiers → iCloud Drive) ou colle le texte copié depuis l'autre version.</div>
    <label class="btn block" style="text-align:center" for="importFile">Choisir un fichier</label><input type="file" id="importFile" accept=".json,application/json,text/plain" hidden>
    <textarea id="importTxt" class="field" rows="4" placeholder="…ou colle ta sauvegarde ici" style="font-weight:600;font-size:13px;resize:vertical"></textarea>
    <button class="btn ghost block" data-act="importTxtGo">Restaurer depuis le texte collé</button><button class="btn ghost block" data-act="closeSheet">Annuler</button>`),
  importTxtGo: () => importBackup($("#importTxt").value),
  copyBackup: async () => { try{ await navigator.clipboard.writeText(backupJSON()); markBackup(); toast("📋","Sauvegarde copiée","Colle-la dans « Restaurer » de l'autre version."); closeSheet(); }catch(e){ const t = $("#bkTxt"); if (t){ t.focus(); t.select(); } toast("⚠️","Copie bloquée","Sélectionne le texte et copie-le à la main."); } },
  saveInfo: () => openSheet(`<h2>Activer la sauvegarde</h2><div class="tipbox">Tes séances sont sauvegardées sur ton compte Claude. Ici, l'appli ne te voit pas connecté, donc rien n'est gardé quand tu la fermes.</div>
    <div class="note">1. Ouvre le lien de l'appli dans Safari et connecte-toi à claude.ai.<br>2. Ajoute-la à l'écran d'accueil depuis Safari, une fois connecté.<br>3. Si l'icône te redemande de te connecter, connecte-toi dedans une fois : ça reste ensuite.<br>4. Quand c'est bon, ce message disparaît et le point en haut devient vert.</div>
    <button class="btn ghost block" data-act="closeSheet">OK</button>`),
  restAdd: () => { if (rest.int){ rest.end += 15000; rest.total += 15; } else startRest(15); },
  restStop: () => stopRest(),
  delW: b => openConfirm("Supprimer cette séance ?", "Elle disparaît du calendrier, des stats et des courbes.", "Supprimer", () => { S.workouts = S.workouts.filter(w => w.id !== b.dataset.id); removeWorkout(b.dataset.id); render(); }),
  progTab: b => { progTab = b.dataset.k; render(); },
  pDel: b => { const a = S.program[progTab].exercises, i = +b.dataset.i; openConfirm("Supprimer « "+a[i].name+" » ?", "Il sort du programme de la séance "+progTab+".", "Supprimer", () => { a.splice(i,1); saveState(); render(); }); },
  pAdd: () => openPicker("Ajouter à la séance "+progTab, n => { S.program[progTab].exercises.push({id:newId(), name:n, sets:3, reps:isAbs(n) ? "12-15" : "10-12", rest:R, alts:[], bonus:isAbs(n)}); saveState(); render(); }),
  pOpt: b => { const e = S.program[progTab].exercises[+b.dataset.i]; e.opt = !e.opt; saveState(); render(); },
  pReset: () => openConfirm("Remettre le programme de départ ?", "Tes modifs du programme sont effacées. L'historique reste.", "Remettre", () => { S.program = withIds(clone(DEFAULT_PROGRAM)); saveState(); render(); }),
  rename: () => openSheet(`<h2>Nom de l'appli</h2><input id="nameIn" value="${esc(S.settings.appName||"Spololo")}" maxlength="24"><button class="btn block" data-act="renameGo">Valider</button><button class="btn ghost block" data-act="closeSheet">Annuler</button>`),
  renameGo: () => { const v = $("#nameIn").value.trim(); if (v){ S.settings.appName = v; saveState(); } closeSheet(); render(); },
  settings: () => { const un = unlocked(), st = S.settings, nameOf = id => (ACHS.find(a => a.id === id)||{}).t;
    openSheet(`<h2>Réglages & perso</h2><span class="label">Mode</span><div class="seg">${[["auto","Auto"],["light","Clair"],["dark","Sombre"]].map(([k,l]) => `<button class="${st.theme===k?"on":""}" style="--sc:var(--ink);--sc-on:var(--bg)" data-act="theme" data-k="${k}">${l}</button>`).join("")}</div>
    <span class="label">Couleurs</span><div class="pal">${PALETTES.map(p => { const lock = p.ach && !un.has(p.ach), c = p.dark;
      return `<button class="${st.palette===p.id?"on":""}" data-act="pal" data-k="${p.id}" ${lock?"disabled":""}><span class="sw"><i style="background:${c.bg}"></i><i style="background:${c.a}"></i><i style="background:${c.b}"></i><i style="background:${c.c}"></i></span>${lock?"🔒 ":""}${esc(p.name)}${lock?`<span class="reward">Succès « ${esc(nameOf(p.ach))} »</span>`:""}</button>`; }).join("")}</div>
    <span class="label">Typo</span><div class="fontlist">${FONTS.map(f => `<button class="${st.font===f.id?"on":""}" data-act="font" data-k="${f.id}" style="font-family:${f.d.replace(/"/g,"'")}, sans-serif${f.pixel?";font-size:12px":""}">${esc(f.name)}<small>${esc(f.note)}</small></button>`).join("")}</div>
    <span class="label">Avatar</span><div class="avs">${AVATARS.map(a => { const lock = a.ach && !un.has(a.ach);
      return `<button class="${st.avatar===a.ic?"on":""}" data-act="avatar" data-k="${a.ic}" ${lock?"disabled":""} aria-label="${lock?"Verrouillé : succès "+esc(nameOf(a.ach)):"Avatar "+a.ic}">${a.ic}</button>`; }).join("")}</div>
    <div class="note">Les cadenas s'ouvrent avec les succès. Sans avatar, c'est le logo S qui s'affiche.</div>
    <span class="label">Barre de menu</span><div class="seg" style="grid-template-columns:1fr 1fr">${[[false,"En bas"],[true,"En haut"]].map(([v,l]) => `<button class="${!!st.navTop===v?"on":""}" style="--sc:var(--ink);--sc-on:var(--bg)" data-act="navPos" data-k="${v?1:0}">${l}</button>`).join("")}</div>
    <div class="note">Si la barre du bas n'apparaît pas quand tu ouvres l'appli depuis l'écran d'accueil, mets-la en haut.</div>
    <span class="label">Sauvegarde</span><div class="note">${STANDALONE ? (backupAge()==null ? "Tes séances sont sur ce téléphone. Aucune sauvegarde iCloud pour l'instant." : "Dernière sauvegarde : il y a "+backupAge()+" j.") : (mode==="cloud" ? "✅ Tes séances sont sauvegardées en ligne, sur ton compte." : "⚠️ Pour l'instant, les données sont gardées seulement dans ce navigateur.")}</div>
    <button class="btn block" data-act="backup">${STANDALONE ? "☁️ Sauvegarder dans iCloud" : "📋 Copier ma sauvegarde"}</button>
    <button class="btn ghost block" data-act="restore">Restaurer une sauvegarde</button>
    <button class="btn ghost block" data-act="closeSheet">Fermer</button>`); },
  navPos: b => { S.settings.navTop = b.dataset.k === "1"; saveState(); reSettings(); },
  theme: b => { S.settings.theme = b.dataset.k; saveState(); reSettings(); },
  pal: b => { S.settings.palette = b.dataset.k; saveState(); reSettings(); },
  font: b => { S.settings.font = b.dataset.k; saveState(); reSettings(); },
  avatar: b => { S.settings.avatar = S.settings.avatar === b.dataset.k ? "" : b.dataset.k; saveState(); reSettings(); },
  addGoal: () => openSheet(`<h2>Nouvel objectif</h2><label class="label" for="gT">Objectif</label><input id="gT" placeholder="ex. 10 tractions d'affilée">
    <span class="label">Type</span><button class="opt" data-act="gKind" data-k="manual"><span class="grow">Je mets à jour moi-même<small>un score que tu notes toi-même</small></span></button><button class="opt" data-act="gKind" data-k="auto"><span class="grow">Charge sur un exo<small>ex. développé couché à 30 kg · suit tes séances</small></span></button><button class="opt" data-act="gKind" data-k="reps"><span class="grow">Répétitions sur un exo<small>ex. 10 tractions · suit tes séances</small></span></button>
    <div id="gMore"></div><button class="btn ghost block" data-act="closeSheet">Annuler</button>`),
  gKind: b => { A._gk = b.dataset.k;
    $("#gMore").innerHTML = (A._gk !== "manual" ? `<label class="label" for="gEx">Exercice</label>${exSelect("gEx")}` : `<label class="label" for="gU">Unité</label><select id="gU" class="field"><option value="reps">répétitions</option><option value="s">secondes</option><option value="min">minutes</option><option value="kg">kg</option></select>`)
      + `<label class="label" for="gN">Cible</label><input id="gN" inputmode="decimal" placeholder="${A._gk==="auto"?"kg":A._gk==="reps"?"répétitions":"nombre"}"><button class="btn block" data-act="gGo" style="margin-top:8px">Créer l'objectif</button>`;
    document.querySelectorAll("#sheet .opt").forEach(o => o.style.boxShadow = o.dataset.k === A._gk ? "inset 0 0 0 2px var(--b)" : ""); },
  gGo: () => { const t = $("#gT").value.trim(), n = num($("#gN").value); if (!n) return;
    const g = A._gk === "auto" ? {id:newId(), kind:"auto", exercise:$("#gEx").value, target:n, unit:"kg", title:t || ($("#gEx").value+" à "+fmt(n)+" kg")} :
      A._gk === "reps" ? {id:newId(), kind:"reps", exercise:$("#gEx").value, target:Math.round(n), unit:"reps", title:t || (fmt(Math.round(n))+" reps en "+$("#gEx").value.toLowerCase())} : {id:newId(), kind:"manual", target:n, unit:$("#gU").value, current:0, title:t || ("Objectif "+fmt(n))};
    addGoal(g); closeSheet(); },
  delGoal: b => { const i = +b.dataset.i; openConfirm("Supprimer cet objectif ?", S.goals[i].title, "Supprimer", () => { S.goals.splice(i,1); saveState(); render(); }); },
  goalPlus: b => bumpGoal(+b.dataset.i, 1),
  goalMinus: b => bumpGoal(+b.dataset.i, -1),
  goalSet: b => { const g = S.goals[+b.dataset.i]; openSheet(`<h2>${esc(g.title)}</h2><label class="label" for="gV">Ton meilleur score</label><input id="gV" inputmode="decimal" value="${g.current ?? 0}"><button class="btn block" data-act="goalSetGo" data-i="${b.dataset.i}">Valider</button><button class="btn ghost block" data-act="closeSheet">Annuler</button>`); },
  goalSetGo: b => { const v = num($("#gV").value); if (v != null){ S.goals[+b.dataset.i].current = v; closeSheet(); afterGoalChange(); } }
};
function backupJSON(){ return JSON.stringify({app:"spololo", v:1, exportedAt:new Date().toISOString(), program:S.program, settings:S.settings, goals:S.goals, library:S.library||[], workouts:S.workouts}); }
function markBackup(){ S.settings.lastBackup = new Date().toISOString(); saveState(); render(); }
async function doBackup(){
  const name = "spololo-sauvegarde-"+dkey(new Date())+".json", json = backupJSON();
  if (STANDALONE){
    const file = new File([json], name, {type:"application/json"});
    try{ if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:"Sauvegarde Spololo"}); markBackup(); toast("☁️","Sauvegarde envoyée","Choisis « Enregistrer dans Fichiers » → iCloud Drive."); return; } }
    catch(e){ if (e && e.name === "AbortError") return; }
    try{ const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove(); markBackup(); toast("💾","Sauvegarde téléchargée", name); return; }catch(e){}
  }
  openSheet(`<h2>Ta sauvegarde</h2><div class="note">Copie ce texte, puis colle-le dans « Restaurer une sauvegarde » de l'autre version de Spololo.</div>
    <textarea id="bkTxt" class="field" rows="5" readonly style="font-weight:600;font-size:12px">${esc(json)}</textarea>
    <button class="btn block" data-act="copyBackup">Copier</button><button class="btn ghost block" data-act="closeSheet">Fermer</button>`);
}
function importBackup(txt){
  let d; try{ d = JSON.parse(String(txt||"").trim()); }catch(e){ toast("⚠️","Fichier illisible","Ce n'est pas une sauvegarde Spololo."); return; }
  if (!d || d.app !== "spololo" || !Array.isArray(d.workouts)){ toast("⚠️","Fichier illisible","Ce n'est pas une sauvegarde Spololo."); return; }
  const ids = new Set(S.workouts.map(w => w.id)), add = d.workouts.filter(w => w && w.id && !ids.has(w.id));
  openConfirm("Restaurer cette sauvegarde ?", `Sauvegarde du ${new Date(d.exportedAt||Date.now()).toLocaleDateString("fr-FR")} : ${d.workouts.length} séances, dont ${add.length} nouvelles ici. Tes séances actuelles sont gardées ; programme, objectifs et réglages sont remplacés par ceux de la sauvegarde.`, "Restaurer", () => {
    S.workouts = [...S.workouts, ...add].sort((a,b) => b.date.localeCompare(a.date));
    if (d.program) S.program = withIds(d.program); if (Array.isArray(d.goals)) S.goals = d.goals; if (Array.isArray(d.library)) S.library = d.library;
    if (d.settings) S.settings = {...S.settings, ...d.settings};
    saveState(); add.forEach(w => saveWorkout(w)); render(); toast("✅","Sauvegarde restaurée", add.length+" séance(s) ajoutée(s)."); });
}
function doSwap(i, name){ const e = S.current.entries[i], ne = makeEntry({name, sets:e.planned, reps:e.target, rest:e.rest, bonus:e.bonus, opt:e.opt});
  ne.pid = e.pid; ne.alts = [e.name, ...(e.alts||[]).filter(n => norm(n) !== norm(name))]; ne.swapped = true; ne.done = e.done; ne.on = e.on;
  S.current.entries[i] = ne; touch(); render(); }
function addGoal(g){ const before = unlocked(); S.goals.push(g); const hits = checkGoals(); saveState(); render(); hits.forEach(h => toast("🎯","Objectif atteint",h.title,true)); announce(before); }
function bumpGoal(i, d){ const g = S.goals[i]; g.current = Math.max(0, (g.current||0) + d); afterGoalChange(); }
function afterGoalChange(){ const before = unlocked(); const hits = checkGoals(); saveStateSoon(); render(); hits.forEach(h => toast("🎯","Objectif atteint",h.title,true)); announce(before); }
function reSettings(){ const y = $("#sheet").scrollTop; render(); A.settings(); $("#sheet").scrollTop = y; }

document.addEventListener("click", e => { const b = e.target.closest("[data-act]"); if (!b || b.disabled) return; const f = A[b.dataset.act]; if (f){ e.preventDefault(); f(b, e); } });
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "pickQ"){ renderPick(t.value); return; }
  if (t.dataset.e && S.current){ const en = S.current.entries[+t.dataset.i], v = num(t.value); en[t.dataset.e] = t.dataset.e === "kg" ? v : (v == null ? null : Math.round(v));
    if (t.dataset.e === "rp"){ const f = t.closest(".fld"); f.classList.remove("isMax"); const mb = f.querySelector(".maxbtn"); mb && mb.classList.remove("on"); t.placeholder = "–"; }
    touch(); }
  if (t.dataset.pf){ const p = S.program[progTab];
    if (t.dataset.pf === "sname") p.name = t.value;
    else { const ex = p.exercises[+t.dataset.i]; if (t.dataset.pf === "sets"){ const n = parseInt(t.value); if (n > 0 && n < 11) ex.sets = n; } else ex[t.dataset.pf] = t.value; }
    saveStateSoon(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "exSel"){ progressEx = t.value; render(); }
  if (t.id === "importFile" && t.files && t.files[0]){ const r = new FileReader(); r.onload = () => importBackup(r.result); r.readAsText(t.files[0]); }
  if (t.dataset.swap != null && S.current){ const i = +t.dataset.swap;
    if (t.value === "__other"){ t.value = S.current.entries[i].name; openPicker("Remplacer « "+S.current.entries[i].name+" »", n => { if (norm(n) !== norm(S.current.entries[i].name)) doSwap(i, n); }); }
    else if (norm(t.value) !== norm(S.current.entries[i].name)) doSwap(i, t.value); }
});
document.addEventListener("visibilitychange", () => { if (document.hidden) flush(); else if (rest.int) tickRest(); });
window.addEventListener("pagehide", flush);

loadLocal(); migrate(); S.program = withIds(S.program);
if (S.current && S.workouts.some(w => w.id === S.current.id)) S.current = null;
render(); askResume(); connect();
if (STANDALONE && "serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
